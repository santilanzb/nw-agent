services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cs-agent-postgres
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: company_agent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/000_create_databases.sh:/docker-entrypoint-initdb.d/000_create_databases.sh:ro
      - ./sql/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - ./sql/002_handoff_state.sql:/docker-entrypoint-initdb.d/002_handoff_state.sql:ro
      - ./sql/003_intent_vectors.sql:/docker-entrypoint-initdb.d/003_intent_vectors.sql:ro
      - ./sql/004_brain.sql:/docker-entrypoint-initdb.d/004_brain.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d company_agent"]
      interval: 10s
      timeout: 5s
      retries: 5

  rag-api:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: cs-agent-rag-api
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://agent:agent@postgres:5432/company_agent}
      PORT: ${RAG_API_PORT:-8081}
    command: uvicorn company_agent.rag_api.main:app --host 0.0.0.0 --port ${RAG_API_PORT:-8081}
    ports:
      - "${RAG_API_PORT:-8081}:${RAG_API_PORT:-8081}"
    depends_on:
      postgres:
        condition: service_healthy

  crm-adapter:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: cs-agent-crm-adapter
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://agent:agent@postgres:5432/company_agent}
      PORT: ${CRM_ADAPTER_PORT:-8082}
    command: uvicorn company_agent.crm_adapter.main:app --host 0.0.0.0 --port ${CRM_ADAPTER_PORT:-8082}
    ports:
      - "${CRM_ADAPTER_PORT:-8082}:${CRM_ADAPTER_PORT:-8082}"
    depends_on:
      postgres:
        condition: service_healthy

  ingest-worker:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: cs-agent-ingest-worker
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://agent:agent@postgres:5432/company_agent}
    command: python -m company_agent.ingest_worker.main sync
    volumes:
      # knowledge/ is still bind-mounted: editing a corpus file and re-running
      # `ingest-worker sync` needs no rebuild.
      #
      # intents/ is deliberately NOT mounted any more. Seeds now live inside the
      # customer_service function package, so editing them requires an image
      # rebuild (~20s warm — only `COPY src` invalidates). That is the cost of
      # having one source of truth: the old mount let this container read the
      # host's seeds while rag-api read the copy baked into its image, and
      # nothing detected the disagreement.
      - ./knowledge:/app/knowledge
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools

  waha:
    image: devlikeapro/waha:latest
    container_name: nw-waha
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - waha_sessions:/app/.sessions
      - waha_files:/tmp/whatsapp-files
    environment:
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      WHATSAPP_HOOK_URL: http://agent-core:8083/webhooks/waha
      WHATSAPP_HOOK_EVENTS: "message,session.status"
      WHATSAPP_HOOK_HMAC_KEY: ${WAHA_HOOK_HMAC_KEY}
      WHATSAPP_HOOK_RETRIES_POLICY: linear
      WHATSAPP_HOOK_RETRIES_DELAY_SECONDS: 2
      WHATSAPP_HOOK_RETRIES_ATTEMPTS: 4
      WAHA_API_KEY: ${WAHA_API_KEY}
      WAHA_DASHBOARD_USERNAME: admin
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD}
      WHATSAPP_SWAGGER_ENABLED: "true"
      WHATSAPP_RESTART_ALL_SESSIONS: "True"
      WAHA_LOG_FORMAT: JSON
      WAHA_LOG_LEVEL: info
      TZ: America/Caracas
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --header \"X-Api-Key: $WAHA_API_KEY\" http://127.0.0.1:3000/api/sessions"]
      interval: 30s
      timeout: 5s
      retries: 3

  agent-core:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: nw-agent-core
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://agent:agent@postgres:5432/company_agent}
      RAG_API_URL: http://rag-api:8081
      CRM_ADAPTER_URL: http://crm-adapter:8082
      WAHA_BASE_URL: http://waha:3000
      WAHA_API_KEY: ${WAHA_API_KEY}
      WAHA_HOOK_HMAC_KEY: ${WAHA_HOOK_HMAC_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      PORT: 8083
    command: uvicorn company_agent.agent_core.main:app --host 0.0.0.0 --port 8083
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      rag-api:
        condition: service_started
      crm-adapter:
        condition: service_started
      waha:
        condition: service_started

  langfuse:
    image: langfuse/langfuse:2
    container_name: nw-langfuse
    restart: unless-stopped
    ports:
      - "3001:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${LANGFUSE_DATABASE_URL:-postgresql://agent:agent@postgres:5432/langfuse}
      NEXTAUTH_URL: ${LANGFUSE_PUBLIC_URL:-http://127.0.0.1:3001}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      SALT: ${LANGFUSE_SALT}
      TELEMETRY_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  waha_sessions:
  waha_files:

