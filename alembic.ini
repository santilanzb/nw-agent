[alembic]
script_location = alembic
prepend_sys_path = src
version_path_separator = os

# Intentionally empty. env.py reads DATABASE_URL from the environment so the same
# migrations run against local compose, the Zoho-sandbox staging DB and the droplet
# without anyone editing a file that is checked into git.
sqlalchemy.url =


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
