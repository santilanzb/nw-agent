[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "company-cs-agent"
version = "0.1.0"
description = "Customer service RAG and CRM services for an OpenClaw-based agent."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "psycopg[binary]>=3.2.0",
  "psycopg-pool>=3.2.0",
  "alembic>=1.13.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "openai>=1.40.0",
  "httpx>=0.27.0",
  "anthropic>=0.49.0",
  "langfuse>=2.0.0",
  "pyyaml>=6.0",
  "phonenumbers>=8.13.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.6.0",
]
eval = [
  "google-genai>=1.0.0",
]

# Ruff's default rule set is neither small nor stable: 0.16 enables ~30 families,
# which is why the repo's finding count moved from 8 to 27 without a line of code
# changing. Pinning `select` makes `ruff check .` mean the same thing next month.
#
# E501 is deliberately absent. Line length is not enforced here today and turning
# it on would rewrite 30 lines across 14 files as a side effect of a lint commit.
# E402 IS selected, because five `# noqa: E402` comments already exist and were
# being reported as unused — the codebase intends the rule.
[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = [
  "E4", "E7", "E9", "E402", "W", "F", "I", "UP", "B", "SIM", "C4",
  "DTZ", "PIE", "RUF", "ASYNC", "LOG", "G", "PT", "FURB", "PERF", "BLE",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# Function packages ship YAML alongside their Python. `pip install .` drops
# non-.py files without this, and nothing on the host would notice: pytest reads
# the source tree via `pythonpath = ["src"]`, so a broken wheel still passes every
# test here and only fails inside the container.
#
# Keyed on "*" rather than per-package on purpose — adding a package must not
# require editing this file, or "drop in a directory" stops being true.
[tool.setuptools.package-data]
"*" = ["manifest.yaml", "seeds.yaml", "evals/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]

